apiVersion: apps/v1
kind: Deployment
metadata:
  name: bindetector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bindetector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bindetector
    spec:
      containers:
        - name: bindetector
          image: ghcr.io/chrisns/poormanyolocam:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: UPSTREAM_URL
              value: http://paparazzogo-driveway.paparazzogo.svc.cluster.local/api/imageproxy/driveway
            - name: WORLD_PROMPTS
              value: "wheelie bin,car,person"
            - name: CONF_THRESHOLD
              value: "0.4"
            - name: MIN_CY
              value: "150"
          resources:
            requests:
              memory: 1Gi
              cpu: 200m
            limits:
              memory: 3Gi
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
