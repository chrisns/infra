mqtt:
  enabled: true
  host: bbcd2e76e705454ab243493a9698c076.s1.eu.hivemq.cloud
  port: 8883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  tls_ca_certs: /etc/ssl/certs/ca-certificates.crt

detectors:
  coral:
    type: edgetpu
    device: pci

logger:
  # default: info
  default: warning
  # logs:
  #   frigate.event: debug


birdseye:
  enabled: false

ffmpeg:
  hwaccel_args: preset-vaapi
  global_args: -hide_banner -loglevel warning -threads 2
  input_args:
    - -r
    - "30" # << enter FPS here
    - -stream_loop
    - "-1"
    - -f
    - image2
    - -avoid_negative_ts
    - make_zero
    - -fflags
    - nobuffer
    - -flags
    - low_delay
    - -strict
    - experimental
    - -fflags
    - +genpts+discardcorrupt
    - -use_wallclock_as_timestamps
    - "1"
  output_args:
    # Optional: output args for detect streams (default: shown below)
    detect: -threads 2 -f rawvideo -pix_fmt yuv420p
    # Optional: output args for record streams (default: shown below)
    record: preset-record-generic
    # Optional: output args for rtmp streams (default: shown below)
    # rtmp: preset-rtmp-generic
  retry_interval: 10

detect:
  fps: 5
  enabled: true
  min_initialized: 2
  max_disappeared: 25
  stationary:
    interval: 50
    threshold: 50
  annotation_offset: 0

objects:
  track:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - car
    - horse

motion:
  threshold: 40
  lightning_threshold: 0.8
  contour_area: 10
  frame_alpha: 0.01
  frame_height: 100
  improve_contrast: True

record:
  enabled: false
  events:
    retain:
      default: 2

snapshots:
  enabled: True
  retain:
    default: 30

# rtmp:
#   enabled: False

live:
  stream_name: camera_name
  height: 720
  quality: 8

go2rtc:
  streams:
    driveway: ffmpeg:driveway#video=h264

