apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-note
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: index-note
  template:
    metadata:
      labels:
        app.kubernetes.io/name: index-note
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: index-note
          image: ghcr.io/chrisns/index-cf-note-queue:1.1.2 # Renovate bumps this
          env:
            - name: INDEX_BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: index-note
                  key: INDEX_BEARER_TOKENS
            - name: VAULT_DIR
              value: /vault
            - name: TZ
              value: Europe/London
            - name: LISTEN_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
          - mountPath: /vault
            name: vault
      volumes:
      - name: vault
        persistentVolumeClaim:
          claimName: index-note
