apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no Ingress, no Certificate and no external-dns annotation:
# the Cloudflare tunnel is the only way in. See SPEC.md section 9.
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - cloudflared.yaml

namespace: index-note

secretGenerator:
  - name: index-note
    env: .env
    files:
      - credentials.json

configMapGenerator:
  - name: cloudflared-config
    files:
      - config.yaml=cloudflared-config.yaml

generatorOptions:
  disableNameSuffixHash: true
